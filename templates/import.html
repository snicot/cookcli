{% extends "base.html" %}

{% block title %}{{ tr.t("import-title") }} - Cook{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto">
    <h1 class="text-display font-bold text-text mb-8">{{ tr.t("import-title") }}</h1>

    {% if let Some(err) = error %}
    <div class="mb-6 card p-4 border-l-[3px] border-l-danger bg-danger-soft">
        <div class="flex items-center gap-2">
            <svg class="w-5 h-5 text-danger shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <p class="text-text">{{ err }}</p>
        </div>
    </div>
    {% endif %}

    <form id="import-form" action="{{ prefix }}/import" method="POST" class="space-y-6">
        <input type="hidden" name="mode" id="import-mode" value="{% if from_text %}text{% else %}url{% endif %}">

        <div class="inline-flex p-1 gap-1 rounded-[var(--radius-control)] bg-sunk" role="tablist" aria-label="{{ tr.t("import-title") }}">
            <button type="button" role="tab" data-import-tab="url" aria-controls="import-url-panel"
                    aria-selected="{% if from_text %}false{% else %}true{% endif %}"
                    class="btn btn-sm border-0 {% if !from_text %}bg-surface shadow-sm{% else %}bg-transparent{% endif %}">
                {{ tr.t("import-from-link") }}
            </button>
            <button type="button" role="tab" data-import-tab="text" aria-controls="import-text-panel"
                    aria-selected="{% if from_text %}true{% else %}false{% endif %}"
                    class="btn btn-sm border-0 {% if from_text %}bg-surface shadow-sm{% else %}bg-transparent{% endif %}">
                {{ tr.t("import-from-text") }}
            </button>
        </div>

        <div id="import-url-panel" role="tabpanel" {% if from_text %}hidden{% endif %}>
            <label for="import-url" class="block text-sm font-medium text-muted mb-2">{{ tr.t("import-url") }}</label>
            <input
                type="url"
                id="import-url"
                name="url"
                {% if !from_text %}required autofocus{% endif %}
                placeholder="https://…"
                value="{{ url }}"
                class="w-full px-4 py-3 border {% if error.is_some() && !from_text %}border-danger{% else %}border-line{% endif %} rounded-[var(--radius-control)] bg-surface text-text outline-hidden focus:border-accent focus:shadow-[0_0_0_2px_var(--accent-soft)]"
            >
        </div>

        <div id="import-text-panel" role="tabpanel" {% if !from_text %}hidden{% endif %}>
            <label for="import-text" class="block text-sm font-medium text-muted mb-2">{{ tr.t("import-text") }}</label>
            <textarea
                id="import-text"
                name="text"
                rows="12"
                maxlength="20000"
                {% if from_text %}required autofocus{% endif %}
                placeholder="{{ tr.t("import-text-placeholder") }}"
                class="w-full px-4 py-3 border {% if error.is_some() && from_text %}border-danger{% else %}border-line{% endif %} rounded-[var(--radius-control)] bg-surface text-text outline-hidden focus:border-accent focus:shadow-[0_0_0_2px_var(--accent-soft)] resize-y"
            >{{ text }}</textarea>
        </div>

        <div>
            <label for="import-folder" class="block text-sm font-medium text-muted mb-2">{{ tr.t("import-folder") }}</label>
            <select id="import-folder" name="folder"
                    class="w-full px-4 py-3 border border-line rounded-[var(--radius-control)] bg-surface text-text outline-hidden focus:border-accent focus:shadow-[0_0_0_2px_var(--accent-soft)]">
                {% for f in folders %}
                <option value="{{ f }}" {% if f.as_str() == folder.as_str() %}selected{% endif %}>{{ f }}</option>
                {% endfor %}
            </select>
            <p class="mt-2 text-sm text-faint">{{ tr.t("import-hint") }}</p>
        </div>

        <div class="flex gap-4">
            <a href="{{ prefix }}/" class="btn">{{ tr.t("action-cancel") }}</a>
            <button type="submit" id="import-submit" class="btn btn-primary">
                <svg id="import-spinner" class="hidden w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="3" opacity="0.25"></circle>
                    <path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="3" stroke-linecap="round"></path>
                </svg>
                <span id="import-label">{{ tr.t("import-submit") }}</span>
            </button>
        </div>
    </form>
</div>

<script>
(function () {
    const form = document.getElementById('import-form');
    const mode = document.getElementById('import-mode');
    const fields = { url: document.getElementById('import-url'), text: document.getElementById('import-text') };
    const panels = { url: document.getElementById('import-url-panel'), text: document.getElementById('import-text-panel') };

    // Two ways in, one form: only the visible field is required and sent as the source.
    function show(which) {
        mode.value = which;
        document.querySelectorAll('[data-import-tab]').forEach(tab => {
            const on = tab.dataset.importTab === which;
            tab.setAttribute('aria-selected', on);
            tab.classList.toggle('bg-surface', on);
            tab.classList.toggle('shadow-sm', on);
            tab.classList.toggle('bg-transparent', !on);
        });
        for (const key of ['url', 'text']) {
            panels[key].hidden = key !== which;
            fields[key].required = key === which;
        }
        fields[which].focus();
    }
    document.querySelectorAll('[data-import-tab]').forEach(tab =>
        tab.addEventListener('click', () => show(tab.dataset.importTab)));

    // Conversion takes a few seconds: show it, and keep a second click from importing twice.
    form.addEventListener('submit', () => {
        const button = document.getElementById('import-submit');
        button.disabled = true;
        button.setAttribute('aria-busy', 'true');
        document.getElementById('import-spinner').classList.remove('hidden');
        document.getElementById('import-label').textContent = {{ tr.t("import-working")|json|safe }};
    });
})();
</script>
{% endblock %}
